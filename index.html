<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>MythosOS 0.2</title>
<style>
:root{--bg:#0a1316;--s:#12212a;--s2:#1b313c;--t:#e8eef0;--m:#93a8b1;--a:#e8a45a;--ai:#1a1206;--b:#ffffff24;--sh:0 14px 44px #0009;--bar:52px;--d:.2s}
:root[data-theme=light]{--bg:#eef1ec;--s:#fbfcfa;--s2:#e1e7df;--t:#14201c;--m:#556760;--a:#a85512;--ai:#fff;--b:#00000026;--sh:0 14px 44px #0003}
:root[data-theme=midnight]{--bg:#0b0e24;--s:#141a3d;--s2:#1f2756;--t:#e9ecff;--m:#97a0d6;--a:#8aa2ff;--ai:#06102e}
:root[data-theme=aurora]{--bg:#06141a;--s:#0d2a2c;--s2:#14403d;--t:#e6fbf3;--m:#86b9aa;--a:#5be3b0;--ai:#03140e}
:root[data-theme=graphite]{--bg:#161616;--s:#222;--s2:#2e2e2e;--t:#eee;--m:#9a9a9a;--a:#cfd4dc;--ai:#111}
:root[data-theme=nebula]{--bg:#150b26;--s:#241240;--s2:#33195c;--t:#f3e9ff;--m:#b49bd6;--a:#d58bff;--ai:#1d0a30}
:root[data-motion=off]{--d:0s}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font:14px/1.45 system-ui,"Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);color:var(--t)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:inherit}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:8px 10px;min-width:0}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.sp{flex:1}.m{color:var(--m)}.sm{font-size:.85em}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none;background:var(--c,#444)}
.pb,.sb{padding:8px 16px;border-radius:99px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.pb{background:var(--a);color:var(--ai)}.sb{background:var(--s2);border:1px solid var(--b)}
[hidden]{display:none!important}

/* Desktop */
#wall{position:fixed;inset:0 0 var(--bar);background:var(--wall,#0a1316);transition:background var(--d)}
#icons{position:fixed;inset:0 0 var(--bar);padding:16px;display:grid;grid-template-rows:repeat(auto-fill,96px);grid-auto-flow:column;grid-auto-columns:96px;align-content:start;gap:6px}
.di{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:12px;color:#fff;text-shadow:0 1px 4px #000c;font-size:12px;text-align:center;word-break:break-word}
.di:hover,.di:focus-visible{background:#ffffff1f}

/* Windows */
#wins{position:fixed;inset:0 0 var(--bar);pointer-events:none}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:var(--s);border:1px solid var(--b);border-radius:14px;box-shadow:var(--sh);overflow:hidden;min-width:300px;min-height:200px;transition:left var(--d),top var(--d),width var(--d),height var(--d)}
.win:not(.on) .wt{opacity:.65}
.win.on{border-color:color-mix(in srgb,var(--a) 55%,var(--b))}
.win[hidden]{display:none}
.wt{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 10px;background:var(--s2);cursor:grab;user-select:none;touch-action:none}
.wt .ico{width:24px;height:24px;font-size:13px;border-radius:7px}
.wt b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.wt button{width:28px;height:26px;border-radius:7px;font-size:15px}.wt button:hover{background:var(--b)}
.wt [data-w=x]:hover{background:#d24;color:#fff}
.wb{flex:1;min-height:0;overflow:auto;position:relative}
.rs{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;touch-action:none}

/* Taskbar */
#bar{position:fixed;inset:auto 0 0 0;height:var(--bar);display:flex;align-items:center;gap:8px;padding:0 10px;background:color-mix(in srgb,var(--s) 90%,transparent);border-top:1px solid var(--b);backdrop-filter:blur(14px);z-index:50}
#start{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:var(--ai);background:var(--a)}
#tasks{flex:1;display:flex;gap:6px;overflow-x:auto;min-width:0}
.tk{position:relative;height:40px;min-width:40px;padding:0 10px;border-radius:12px;display:flex;align-items:center;gap:8px;max-width:180px}
.tk:hover{background:var(--s2)}.tk.on{background:var(--s2)}
.tk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk.run::after{content:"";position:absolute;bottom:2px;left:50%;width:14px;margin-left:-7px;height:3px;border-radius:2px;background:var(--a)}
#clk{font-variant-numeric:tabular-nums;text-align:right;font-size:12px;line-height:1.2;padding:0 6px;color:var(--m)}
#clk b{display:block;color:var(--t);font-size:13px}

/* Overlays */
.ov{position:fixed;inset:0;z-index:100;background:#0006;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh}
.pn{background:var(--s);border:1px solid var(--b);border-radius:18px;box-shadow:var(--sh);width:min(560px,calc(100vw - 24px));max-height:70vh;display:flex;flex-direction:column;overflow:hidden}
.qb{padding:12px 14px;border:0;border-bottom:1px solid var(--b);border-radius:0;width:100%;font-size:1.05em}
#lr{overflow:auto;padding:6px}
.res{display:flex;gap:12px;align-items:center;width:100%;padding:8px 10px;border-radius:12px}
.res:hover,.res.sel{background:var(--s2)}
.res small{display:block;color:var(--m)}
#ctx{position:fixed;z-index:120;min-width:200px;padding:6px;border-radius:12px;background:var(--s);border:1px solid var(--b);box-shadow:var(--sh)}
#ctx button{display:block;width:100%;padding:8px 12px;border-radius:8px}#ctx button:hover,#ctx button:focus-visible{background:var(--s2)}
#toasts{position:fixed;top:14px;right:14px;z-index:130;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:14px;background:var(--s);border:1px solid var(--b);box-shadow:var(--sh);max-width:340px;animation:in .2s}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}

/* App content */
.pad{padding:16px}
h2{font-size:1.1em;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.card{padding:14px;border-radius:14px;background:var(--s2);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--b)}
.toolbar{display:flex;gap:8px;align-items:center;padding:10px;border-bottom:1px solid var(--b);flex-wrap:wrap}
.crumb{padding:4px 8px;border-radius:8px}.crumb:hover{background:var(--s2)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;text-align:left}
.item:hover{background:var(--s2)}
.tog{width:44px;height:24px;border-radius:12px;background:var(--s2);border:1px solid var(--b);position:relative}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--m);transition:transform var(--d)}
.tog[aria-checked=true]{background:var(--a)}.tog[aria-checked=true]::after{transform:translateX(20px);background:var(--ai)}
.opt[aria-pressed=true]{outline:2px solid var(--a)}
.swatch{width:100%;height:56px;border-radius:10px;border:1px solid var(--b)}
textarea.notes{width:100%;height:100%;border:0;border-radius:0;resize:none;padding:14px;background:var(--s);font-size:15px}
.chat{display:flex;flex-direction:column;height:100%}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:8px 12px;border-radius:14px;white-space:pre-wrap;background:var(--s2);align-self:flex-start}
.msg.u{background:var(--a);color:var(--ai);align-self:flex-end}
.cin{display:flex;gap:8px;padding:10px;border-top:1px solid var(--b)}.cin input{flex:1}
.gcard{position:relative}
.gart{height:90px;border-radius:12px;display:grid;place-items:center;font:700 40px Georgia,serif;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 60% 45%),hsl(var(--h) 50% 20%))}
.fav{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:#000a;color:#fff}
.fav[aria-pressed=true]{background:var(--a);color:var(--ai)}
.beacon{position:absolute;width:52px;height:52px;border-radius:50%;background:var(--a);box-shadow:0 0 0 8px #fff2;transition:left var(--d),top var(--d)}
.field{position:relative;height:100%;background:radial-gradient(hsl(var(--h) 60% 30%),var(--s))}

@media(max-width:720px){.win{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}.rs{display:none}#clk small{display:none}}
@media(prefers-reduced-motion:reduce){:root{--d:0s}}
</style>
</head>
<body>
<div id="wall"></div>
<main id="icons" aria-label="Desktop"></main>
<div id="wins"></div>

<nav id="bar" aria-label="Taskbar">
  <button id="start" aria-label="Open launcher" title="Launcher (Ctrl+Space)">M</button>
  <div id="tasks"></div>
  <time id="clk"><b></b><span></span></time>
</nav>

<div id="toasts" aria-live="polite"></div>
<div id="ctx" role="menu" hidden></div>

<div class="ov" id="lau" hidden role="dialog" aria-modal="true" aria-label="Launcher">
  <div class="pn"><input class="qb" id="lq" placeholder="Search apps, games, commands" aria-label="Search" autocomplete="off"><div id="lr"></div></div>
</div>

<script>
'use strict';
/* ---------- Helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const clamp=(v,a,b)=>Math.min(Math.max(v,a),b);
const ago=t=>{const s=(Date.now()-t)/1e3;return s<60?'just now':s<3600?Math.floor(s/60)+' min ago':s<86400?Math.floor(s/3600)+' h ago':new Date(t).toLocaleDateString()};
const BAD=['__proto__','constructor','prototype'];
const cleanName=s=>String(s).replace(/[\/\\]/g,'-').trim().slice(0,60);

/* ---------- Data ---------- */
const THEMES={dark:'Mythos Dark',light:'Mythos Light',midnight:'Midnight',aurora:'Aurora',graphite:'Graphite',nebula:'Nebula'};
const WALLS={obsidian:['Obsidian','radial-gradient(90% 80% at 85% 0%,#1f5560aa,transparent 60%),#0a1316'],
 midnight:['Midnight','linear-gradient(160deg,#0b1030,#1c2760 55%,#0b1030)'],
 nebula:['Nebula','radial-gradient(60% 50% at 72% 28%,#8a35c8bb,transparent),radial-gradient(55% 55% at 18% 82%,#1f6fb8aa,transparent),#0e0820'],
 aurora:['Aurora','linear-gradient(120deg,#031a1f,#0b4a45 45%,#0a2f3b)'],
 abstract:['Abstract','conic-gradient(from 210deg at 70% 40%,#e8a45a66,#1d4a52,#2a1a3a,#e8a45a66),#0a1316'],
 minimal:['Minimal','linear-gradient(#2a3036,#14181b)'],
 grid:['Mythos Grid','linear-gradient(#ffffff10 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,#ffffff10 1px,transparent 1px) 0 0/48px 48px,radial-gradient(80% 60% at 50% 0,#1d4a52,#0a1316)']};
const ACCENTS=['#e8a45a','#8aa2ff','#5be3b0','#ff7a90','#d58bff','#f2d65c'];
/* Add `src` to any game to embed a real game in its window. */
const GAMES=[
 {id:'runner',t:'Mythos Runner',c:'Platformer',h:28,r:4.7,d:'Sprint through shifting ruins in a one-button endless run.',k:'Space: jump. Down: slide.'},
 {id:'blocks',t:'Mythos Blocks',c:'Puzzle',h:55,r:4.8,d:'Fit shifting shapes into a growing tower.',k:'Arrows: move. Up: rotate.'},
 {id:'defense',t:'Mythos Defense',c:'Strategy',h:350,r:4.6,d:'Hold the relay line with towers, traps and timing.',k:'Mouse: place towers. Space: start wave.'},
 {id:'kart',t:'Mythos Kart',c:'Racing',h:200,r:4.5,d:'Drift, boost and outpace friends on floating tracks.',k:'Arrows: steer. Space: drift.'},
 {id:'golf',t:'Mythos Golf',c:'Sports',h:120,r:4.4,d:'Eighteen holes of sand, water and wind. Aim, charge, release.',k:'Space or mouse: charge and swing. Up/Down: angle. 1/2/3: club. R: restart.',src:'golf/index.html'},
 {id:'orbit',t:'Orbit Dash',c:'Arcade',h:240,r:4.1,d:'Slingshot between planets and chase the high score.',k:'Click to launch.'}
];
const APPS={
 notes:{n:'Notes',ic:'📝',c:'#b8860b',w:[520,420]},
 files:{n:'Files',ic:'📁',c:'#2b6cb0',w:[700,480]},
 arcade:{n:'Arcade',ic:'🎮',c:'#7b3fbf',w:[760,540]},
 ai:{n:'Mythos AI',ic:'✨',c:'#0f766e',w:[440,560]},
 sentinel:{n:'Sentinel',ic:'🛡️',c:'#2f855a',w:[480,460]},
 settings:{n:'Settings',ic:'⚙️',c:'#4a5568',w:[700,500]}
};
const COMMANDS=[
 ['Next wallpaper','cmd:wall'],['Toggle light/dark theme','cmd:theme'],['Toggle reduced motion','cmd:motion'],
 ['Show desktop','cmd:min'],['New folder on Desktop','cmd:newdir']
];

/* ---------- State with safe persistence ---------- */
const KEY='mythos.v2';
const DEF={theme:'dark',wall:'obsidian',accent:'#e8a45a',motion:true,pins:['notes','files','arcade','ai','settings'],fav:[],notes:'',
 fs:{Desktop:{'Welcome.txt':'Welcome to MythosOS 0.2.\nOpen the launcher with Ctrl+Space.'},Documents:{'Ideas.txt':'- real games\n- AI backend'},Games:{}}};
function load(){try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(!o||typeof o!=='object')return structuredClone(DEF);
 const s={...structuredClone(DEF),...o};
 if(!THEMES[s.theme])s.theme=DEF.theme;if(!WALLS[s.wall])s.wall=DEF.wall;if(!/^#[0-9a-f]{6}$/i.test(s.accent))s.accent=DEF.accent;
 s.motion=!!s.motion;s.pins=(Array.isArray(s.pins)?s.pins:[]).filter(k=>APPS[k]);s.fav=(Array.isArray(s.fav)?s.fav:[]).filter(id=>GAMES.some(g=>g.id===id));
 s.notes=String(s.notes||'').slice(0,100000);if(!s.fs||typeof s.fs!=='object'||Array.isArray(s.fs))s.fs=structuredClone(DEF.fs);
 return s}catch(e){return structuredClone(DEF)}}
let S=load(),saveT=0,saveFailed=false;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));saveFailed=false}catch(e){if(!saveFailed)toast('Storage','Changes cannot be saved in this browser.','⚠️');saveFailed=true}},200)}

/* ---------- Virtual file system ---------- */
const fsAt=p=>{let n=S.fs;for(const k of p){if(!n||typeof n!=='object'||!Object.prototype.hasOwnProperty.call(n,k))return null;n=n[k]}return n};
const isDir=n=>n!==null&&typeof n==='object';
const fsWalk=(d,p,f)=>{for(const k of Object.keys(d)){const q=[...p,k];f(k,q,d[k]);if(isDir(d[k]))fsWalk(d[k],q,f)}};
const fsAddName=(dir,name)=>{let n=name,i=2;while(Object.prototype.hasOwnProperty.call(dir,n))n=name.replace(/(\.\w+)?$/,' '+i++ +'$1');return n};

/* ---------- Toasts & menus ---------- */
function toast(title,msg,ic='🔔'){const e=document.createElement('div');e.className='toast';e.innerHTML=`<span class="ico" style="--c:#2d3748">${ic}</span><div><b>${esc(title)}</b><div class="m sm">${esc(msg)}</div></div>`;
 $('#toasts').append(e);setTimeout(()=>e.remove(),4000)}
function ctxMenu(x,y,items){const c=$('#ctx');c.innerHTML=items.map(([l,f])=>`<button role="menuitem">${esc(l)}</button>`).join('');
 c.hidden=false;c.style.left=clamp(x,4,innerWidth-220)+'px';c.style.top=clamp(y,4,innerHeight-c.offsetHeight-60)+'px';
 [...c.children].forEach((b,i)=>b.onclick=()=>{hideCtx();items[i][1]()});c.firstChild.focus()}
const hideCtx=()=>{$('#ctx').hidden=true};

/* ---------- Window manager ---------- */
const wins=new Map();let zTop=10,seq=0;
function openApp(id,o={}){const a=APPS[id]||{n:o.title||'App',ic:'🗂️',c:'#444',w:[480,360]};const key=o.key||id;
 if(wins.has(key)){const r=wins.get(key);r.el.hidden=false;focusWin(key);return r}
 const el=document.createElement('section');el.className='win';el.setAttribute('role','dialog');el.setAttribute('aria-label',o.title||a.n);
 el.innerHTML=`<header class="wt"><span class="ico" style="--c:${a.c}">${a.ic}</span><b>${esc(o.title||a.n)}</b><span class="sp"></span><button data-w="min" aria-label="Minimize">–</button><button data-w="max" aria-label="Maximize">□</button><button data-w="x" aria-label="Close">×</button></header><div class="wb"></div><i class="rs"></i>`;
 const [w,h]=o.size||a.w,n=wins.size*28%180;
 Object.assign(el.style,{width:w+'px',height:h+'px',left:(90+n)+'px',top:(30+n)+'px'});
 $('#wins').append(el);const rec={el,key,id,title:o.title||a.n,saved:null};wins.set(key,rec);
 const body=$('.wb',el);(o.render||RENDER[id]||(()=>{body.innerHTML='<p class="pad m">This app is not available.</p>'}))(body,rec,o);
 focusWin(key);updateTasks();return rec}
function focusWin(key){const r=wins.get(key);if(!r)return;document.querySelectorAll('.win.on').forEach(x=>x.classList.remove('on'));
 r.el.classList.add('on');r.el.style.zIndex=++zTop;r.el.hidden=false;updateTasks()}
function closeWin(key){const r=wins.get(key);if(!r)return;wins.delete(key);r.el.remove();
 const top=[...wins.values()].filter(x=>!x.el.hidden).sort((a,b)=>b.el.style.zIndex-a.el.style.zIndex)[0];if(top)focusWin(top.key);else updateTasks()}
function minWin(key){const r=wins.get(key);if(!r)return;r.el.hidden=true;r.el.classList.remove('on');updateTasks()}
function setSnap(r,m){const s=r.el.style,H=innerHeight-52;if(!r.saved)r.saved={l:r.el.style.left,t:r.el.style.top,w:r.el.style.width,h:r.el.style.height};
 r.el.dataset.snap=m;if(m==='max'){Object.assign(s,{left:'0px',top:'0px',width:'100%',height:H+'px'})}
 else{Object.assign(s,{top:'0px',height:H+'px',width:innerWidth/2+'px',left:m==='L'?'0px':innerWidth/2+'px'})}}
function unsnap(r){if(!r.el.dataset.snap)return;delete r.el.dataset.snap;if(r.saved){Object.assign(r.el.style,{left:r.saved.l,top:r.saved.t,width:r.saved.w,height:r.saved.h});r.saved=null}}

let drag=null;
$('#wins').addEventListener('pointerdown',e=>{const el=e.target.closest('.win');if(!el)return;const r=[...wins.values()].find(x=>x.el===el);if(!r)return;
 focusWin(r.key);if(e.target.closest('button'))return;const isRs=e.target.classList.contains('rs');if(!isRs&&!e.target.closest('.wt'))return;
 if(!isRs&&r.el.dataset.snap){const prevW=r.saved?parseFloat(r.saved.w):500;unsnap(r);r.el.style.width=prevW+'px';r.el.style.left=(e.clientX-prevW/2)+'px'}
 drag={r,isRs,x:e.clientX,y:e.clientY,l:r.el.offsetLeft,t:r.el.offsetTop,w:r.el.offsetWidth,h:r.el.offsetHeight};
 try{el.setPointerCapture(e.pointerId)}catch(_){}});
addEventListener('pointermove',e=>{if(!drag)return;const{r,isRs}=drag,dx=e.clientX-drag.x,dy=e.clientY-drag.y,s=r.el.style;
 if(isRs){s.width=Math.max(300,drag.w+dx)+'px';s.height=Math.max(200,drag.h+dy)+'px'}
 else{s.left=clamp(drag.l+dx,-drag.w+120,innerWidth-120)+'px';s.top=clamp(drag.t+dy,0,innerHeight-60)+'px'}});
addEventListener('pointerup',e=>{if(!drag)return;const{r,isRs}=drag;drag=null;if(isRs)return;
 if(e.clientY<6)setSnap(r,'max');else if(e.clientX<6)setSnap(r,'L');else if(e.clientX>innerWidth-6)setSnap(r,'R')});
$('#wins').addEventListener('click',e=>{const b=e.target.closest('[data-w]');if(!b)return;const key=[...wins.values()].find(x=>x.el.contains(b)).key,r=wins.get(key);
 const a=b.dataset.w;if(a==='x')closeWin(key);else if(a==='min')minWin(key);else{if(r.el.dataset.snap){unsnap(r)}else setSnap(r,'max')}});
$('#wins').addEventListener('dblclick',e=>{const t=e.target.closest('.wt');if(!t||e.target.closest('button'))return;const r=[...wins.values()].find(x=>x.el.contains(t));
 if(r.el.dataset.snap)unsnap(r);else setSnap(r,'max')});

/* ---------- Taskbar & desktop ---------- */
function updateTasks(){const keys=[...new Set([...S.pins,...wins.keys()])];
 $('#tasks').innerHTML=keys.map(k=>{const r=wins.get(k),a=APPS[k]||{n:r?r.title:k,ic:'🗂️'},on=r&&!r.el.hidden&&r.el.classList.contains('on'),run=!!r;
  return `<button class="tk${on?' on':''}${run?' run':''}" data-task="${esc(k)}" aria-label="${esc(a.n)}${run?(r.el.hidden?' (minimized)':' (open)'):''}"><span>${a.ic}</span><span class="sm">${esc(a.n)}</span></button>`}).join('')}
$('#tasks').addEventListener('click',e=>{const b=e.target.closest('[data-task]');if(!b)return;const k=b.dataset.task,r=wins.get(k);
 if(!r)openApp(k);else if(r.el.hidden||!r.el.classList.contains('on'))focusWin(k);else minWin(k)});
function renderDesktop(){const d=fsAt(['Desktop'])||{};
 $('#icons').innerHTML=Object.keys(APPS).map(id=>`<button class="di" data-app="${id}"><span class="ico" style="--c:${APPS[id].c}">${APPS[id].ic}</span>${APPS[id].n}</button>`).join('')+
 Object.keys(d).map(k=>`<button class="di" data-file="${esc(k)}"><span class="ico" style="--c:#555">${isDir(d[k])?'📁':'📄'}</span>${esc(k)}</button>`).join('')}
$('#icons').addEventListener('dblclick',e=>{const b=e.target.closest('[data-app]');if(b)openApp(b.dataset.app);const f=e.target.closest('[data-file]');if(f)openFile(['Desktop',f.dataset.file])});
$('#icons').addEventListener('click',e=>{const b=e.target.closest('[data-app]');if(b&&matchMedia('(pointer:coarse)').matches)openApp(b.dataset.app);const f=e.target.closest('[data-file]');if(f&&matchMedia('(pointer:coarse)').matches)openFile(['Desktop',f.dataset.file])});
addEventListener('contextmenu',e=>{if(e.target.closest('input,textarea,.win,#bar,#ctx'))return;e.preventDefault();
 const f=e.target.closest('[data-file]');
 if(f){const p=['Desktop',f.dataset.file];ctxMenu(e.clientX,e.clientY,[['Open',()=>openFile(p)],['Rename',()=>renameFile(p)],['Delete',()=>deleteFile(p)]]);return}
 ctxMenu(e.clientX,e.clientY,[['New folder',()=>newItem(['Desktop'],'dir')],['Change wallpaper',()=>cmd('wall')],['Open launcher',()=>openLauncher()]])});
addEventListener('click',e=>{if(!e.target.closest('#ctx'))hideCtx()});

/* ---------- File helpers ---------- */
function openFile(p){const name=p[p.length-1],txt=fsAt(p);if(typeof txt!=='string')return;
 openApp('notes',{key:'f:'+p.join('/'),title:name,size:[520,420],render:(b,r)=>renderNoteFile(b,p)})}
function renderNoteFile(b,p){b.innerHTML=`<div class="chat"><textarea class="notes" aria-label="Contents of ${esc(p[p.length-1])}" spellcheck="false"></textarea><div class="toolbar"><span class="m sm">/${esc(p.join('/'))}</span><span class="sp"></span><output class="m sm"></output><button class="pb" data-save>Save</button></div></div>`;
 const ta=$('textarea',b);ta.value=fsAt(p)||'';
 $('[data-save]',b).onclick=()=>{const parent=fsAt(p.slice(0,-1));if(parent&&isDir(parent)&&Object.prototype.hasOwnProperty.call(parent,p[p.length-1])){parent[p[p.length-1]]=ta.value;save();$('output',b).textContent='Saved'}}}
async function newItem(p,kind){const dir=fsAt(p);if(!isDir(dir))return;const base=kind==='dir'?'New folder':'Untitled.txt';
 const name=prompt(kind==='dir'?'Folder name':'File name',fsAddName(dir,base));if(name==null)return;const n=cleanName(name);
 if(!n||BAD.includes(n))return toast('Files','That name is not allowed.','⚠️');
 if(Object.prototype.hasOwnProperty.call(dir,n))return toast('Files','“'+n+'” already exists.','⚠️');
 dir[n]=kind==='dir'?{}:'';save();refreshAll()}
function renameFile(p){const dir=fsAt(p.slice(0,-1)),old=p[p.length-1];if(!isDir(dir))return;const nm=prompt('Rename',old);if(nm==null)return;const n=cleanName(nm);
 if(!n||n===old||BAD.includes(n))return;if(Object.prototype.hasOwnProperty.call(dir,n))return toast('Files','“'+n+'” already exists.','⚠️');
 dir[n]=dir[old];delete dir[old];closeWin('f:'+p.join('/'));save();refreshAll()}
function deleteFile(p){const dir=fsAt(p.slice(0,-1)),n=p[p.length-1];if(!isDir(dir))return;if(!confirm('Delete “'+n+'”? This cannot be undone.'))return;
 delete dir[n];closeWin('f:'+p.join('/'));save();refreshAll()}
function refreshAll(){renderDesktop();if(wins.has('files'))RENDER.files($('.wb',wins.get('files').el),wins.get('files'))}

/* ---------- Apps ---------- */
const RENDER={};
RENDER.notes=(b)=>{b.innerHTML=`<div class="chat"><textarea class="notes" aria-label="Notes" placeholder="Start typing…"></textarea><div class="toolbar"><span class="m sm">Saved automatically</span></div></div>`;
 const ta=$('textarea',b);ta.value=S.notes;ta.oninput=()=>{S.notes=ta.value;save()}};

RENDER.files=(b,r)=>{const path=r.path||(r.path=['Desktop']);
 b.innerHTML=`<div class="chat"><div class="toolbar"><button class="sb" data-up aria-label="Up one level">↑ Up</button><nav class="sm" style="display:flex;gap:2px;overflow:auto;white-space:nowrap">${['Root',...path].map((n,i)=>`<button class="crumb" data-go="${i}">${esc(n)}</button>`).join('<span class="m">›</span>')}</nav><span class="sp"></span><button class="sb" data-nd>New folder</button><button class="sb" data-nf>New file</button></div><div class="msgs list" style="padding:8px" id="fl"></div></div>`;
 const list=$('#fl',b),d=fsAt(path)||{};
 const names=Object.keys(d).sort((a,c)=>(isDir(d[c])-isDir(d[a]))||a.localeCompare(c,undefined,{numeric:true}));
 list.innerHTML=names.length?names.map(k=>`<button class="item" data-open="${esc(k)}"><span>${isDir(d[k])?'📁':'📄'}</span>${esc(k)}<span class="sp"></span><span class="m sm">${isDir(d[k])?Object.keys(d[k]).length+' items':d[k].length+' chars'}</span></button>`).join(''):'<p class="m pad">This folder is empty.</p>';
 b.onclick=e=>{const t=e.target.closest('button');if(!t)return;
  if(t.hasAttribute('data-up')){if(path.length>0){path.pop();RENDER.files(b,r)}}
  else if(t.dataset.go!=null){const i=+t.dataset.go;r.path=path.slice(0,i);RENDER.files(b,r)}
  else if(t.hasAttribute('data-nd'))newItem(path,'dir');
  else if(t.hasAttribute('data-nf'))newItem(path,'file');
  else if(t.dataset.open!=null){const k=t.dataset.open,p=[...path,k];if(isDir(fsAt(p))){r.path=p;RENDER.files(b,r)}else openFile(p)}};
 const up=$('[data-up]',b);if(up)up.disabled=!path.length};

const isFav=id=>S.fav.includes(id);
RENDER.arcade=(b)=>{const q=()=>{const g=cards();$('#gl',b).innerHTML=g};
 b.innerHTML=`<div class="chat"><div class="toolbar"><input id="gq" type="search" placeholder="Search games" aria-label="Search games" style="flex:1"></div><div class="pad" style="overflow:auto"><div class="grid" id="gl"></div></div></div>`;
 const cards=()=>{const s=($('#gq',b).value||'').toLowerCase();const list=GAMES.filter(g=>(g.t+' '+g.c+' '+g.d).toLowerCase().includes(s));
  return list.length?list.map(g=>`<div class="card gcard" style="--h:${g.h}"><div class="gart">${esc(g.t.split(' ').pop()[0])}</div><b>${esc(g.t)}</b><span class="m sm">${esc(g.c)} · ★ ${g.r}</span><p class="sm">${esc(g.d)}</p><div style="display:flex;gap:8px"><button class="pb" data-play="${g.id}">Play</button><button class="sb" data-fav="${g.id}">${isFav(g.id)?'★ Favorited':'☆ Favorite'}</button></div></div>`).join(''):'<p class="m pad">No games match your search.</p>'};
 $('#gl',b).innerHTML=cards();
 $('#gq',b).oninput=()=>$('#gl',b).innerHTML=cards();
 b.onclick=e=>{const p=e.target.closest('[data-play]');if(p)playGame(p.dataset.play);const f=e.target.closest('[data-fav]');if(f){const id=f.dataset.fav,i=S.fav.indexOf(id);
   if(i<0)S.fav.push(id);else S.fav.splice(i,1);save();$('#gl',b).innerHTML=cards()}}};

function playGame(id){const g=GAMES.find(x=>x.id===id);if(!g)return;
 openApp('g:'+id,{title:g.t,size:[640,500],render:(b)=>{
  if(g.src){b.innerHTML=`<iframe src="${esc(g.src)}" title="${esc(g.t)}" style="width:100%;height:100%;border:0" sandbox="allow-scripts allow-pointer-lock"></iframe>`;return}
  b.innerHTML=`<div class="field" style="--h:${g.h}"><div class="toolbar"><b>${esc(g.t)}</b><span class="sp"></span>Score <output id="sc">0</output></div><p class="m sm pad">Placeholder game: catch the beacon. Add a <code>src</code> to this game in the GAMES list to embed a real one.</p><button class="beacon" aria-label="Catch the beacon"></button></div>`;
  let s=0;const bc=$('.beacon',b);bc.onclick=()=>{$('#sc',b).textContent=++s;bc.style.left=(Math.random()*80+5)+'%';bc.style.top=(Math.random()*60+30)+'%'};bc.style.left='40%';bc.style.top='50%'}})}

RENDER.ai=(b)=>{const hist=[{r:'a',t:'Hi, I am Mythos AI, a local assistant. Ask what MythosOS can do, or tell me what to open.'}];
 b.innerHTML=`<div class="chat"><div class="msgs" id="ml" role="log" aria-live="polite"></div><form class="cin"><input aria-label="Message Mythos AI" placeholder="Ask Mythos AI" autocomplete="off"><button class="pb">Send</button></form></div>`;
 const ml=$('#ml',b),show=()=>{ml.innerHTML=hist.map(m=>`<div class="msg ${m.r==='u'?'u':''}">${esc(m.t)}</div>`).join('');ml.scrollTop=ml.scrollHeight};show();
 $('form',b).onsubmit=e=>{e.preventDefault();const i=$('input',b),t=i.value.trim();if(!t)return;i.value='';hist.push({r:'u',t});const res=aiLocal(t);hist.push({r:'a',t:res.t});show();if(res.run)res.run()}};
function aiLocal(t){const q=t.toLowerCase();const appHit=Object.entries(APPS).find(([id,a])=>q.includes(id)||q.includes(a.n.toLowerCase()));
 if(/^(hi|hello|hey)\b/.test(q))return{t:'Hello! Ask what MythosOS can do, or tell me what to open.'};
 if(/open|launch|start|show/.test(q)&&appHit)return{t:'Opening '+appHit[1].n+'.',run:()=>openApp(appHit[0])};
 if(/wallpaper|background/.test(q))return{t:'Use Settings › Wallpaper, or right-click the desktop and choose Change wallpaper.'};
 if(/dark|light|theme/.test(q)){cmd('theme');return{t:'Theme switched to '+(S.theme==='light'?'light':'dark')+'.'}}
 if(/favorite/.test(q))return{t:S.fav.length?'Your favorites: '+S.fav.map(id=>GAMES.find(g=>g.id===id).t).join(', ')+'.':'No favorites yet. Star a game in Arcade.'};
 if(/time|date/.test(q))return{t:'It is '+new Date().toLocaleString()+'.'};
 if(/game|play/.test(q)){const g=GAMES[Math.floor(Math.random()*GAMES.length)];return{t:'Try '+g.t+': '+g.d,run:()=>playGame(g.id)}}
 if(/what can|help|mythos/.test(q))return{t:'I can open apps, switch themes, list favorites, tell you the time and suggest games. Press Ctrl+Space for the launcher.'};
 return{t:'I am a small local assistant, so I may miss that one. Try "open files" or "suggest a game".'}};

RENDER.sentinel=(b)=>{const st=(()=>{try{localStorage.setItem('mythos.t','1');localStorage.removeItem('mythos.t');return true}catch(e){return false}})();
 let n=0;fsWalk(S.fs,[],()=>n++);
 const checks=[['Local storage',st,st?'Preferences save in this browser':'Unavailable: changes will not persist'],['Virtual files',true,n+' items'],['Windows',true,wins.size+' open'],['Network',navigator.onLine,navigator.onLine?'Online':'Offline (MythosOS does not need a connection)']];
 const good=checks.every(c=>c[1]);
 b.innerHTML=`<div class="pad"><h2>Sentinel</h2><p>${good?'MythosOS is operating normally.':'Some checks need attention.'}</p><div style="margin-top:10px">${checks.map(([a,ok,d])=>`<div class="row"><div>${a}<div class="m sm">${esc(d)}</div></div><b style="color:${ok?'#48bb78':'#e53e3e'}">${ok?'Healthy':'Attention'}</b></div>`).join('')}</div><p class="m sm pad" style="padding:14px 0 0">Sentinel watches this MythosOS simulation. It does not scan your device.</p></div>`};

RENDER.settings=(b)=>{const sw=(on)=>`<button class="tog" role="switch" aria-checked="${on}"></button>`;
 const sw2=(opts,cur,key)=>`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">${opts.map(([v,l,css])=>`<button class="card opt" aria-pressed="${String(cur)===String(v)}" data-set="${key}:${esc(v)}">${css?`<span class="swatch" style="background:${css}"></span>`:''}${esc(l)}</button>`).join('')}</div>`;
 b.innerHTML=`<div class="pad" style="overflow:auto;height:100%"><h2>Theme</h2>${sw2(Object.entries(THEMES),S.theme,'theme')}
 <h2 style="margin-top:20px">Wallpaper</h2>${sw2(Object.entries(WALLS).map(([k,[n,c]])=>[k,n,c]),S.wall,'wall')}
 <h2 style="margin-top:20px">Accent</h2>${sw2(ACCENTS.map(c=>[c,c,c]),S.accent,'accent')}
 <h2 style="margin-top:20px">Behavior</h2><div class="row"><div>Animations<div class="m sm">Turn off for reduced motion</div></div><button class="tog" role="switch" aria-label="Animations" aria-checked="${S.motion}" data-set="motion:${!S.motion}"></button></div>
 <div class="row"><div>Pinned apps<div class="m sm">${S.pins.length} pinned to taskbar</div></div><button class="sb" data-reset-pins>Reset</button></div>
 <h2 style="margin-top:20px">Data</h2><div class="row"><div>Reset MythosOS<div class="m sm">Clears preferences, favorites, notes and files in this browser</div></div><button class="sb" data-reset>Reset…</button></div></div>`;
 b.onclick=e=>{const s=e.target.closest('[data-set]');if(s){const[k,...rest]=s.dataset.set.split(':');const v=rest.join(':');
   if(k==='motion')S.motion=v==='true';else if(k==='accent')S.accent=v;else if(k==='theme')S.theme=THEMES[v]?v:S.theme;else if(k==='wall')S.wall=WALLS[v]?v:S.wall;
   applyTheme();save();RENDER.settings(b);return}
  if(e.target.closest('[data-reset-pins]')){S.pins=[...DEF.pins];save();updateTasks();toast('Settings','Taskbar pins restored','⚙️')}
  if(e.target.closest('[data-reset]')){if(confirm('Reset MythosOS? This clears everything stored in this browser.')){try{localStorage.removeItem(KEY)}catch(_){}location.reload()}}}};

/* ---------- Theme ---------- */
function applyTheme(){const r=document.documentElement;r.dataset.theme=S.theme;r.dataset.motion=S.motion?'on':'off';
 r.style.setProperty('--a',S.accent);r.style.setProperty('--ai',lum(S.accent)>.45?'#10140f':'#fff');
 document.getElementById('wall').style.background=WALLS[S.wall][1];
 const meta=WALLS[S.wall];document.getElementById('wall').dataset.name=meta[0]}
function lum(h){const[r,g,b]=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);return .2126*r+.7152*g+.0722*b}

/* ---------- Commands & launcher ---------- */
function cmd(c){if(c==='wall'){const k=Object.keys(WALLS);S.wall=k[(k.indexOf(S.wall)+1)%k.length];applyTheme();save();toast('Wallpaper',WALLS[S.wall][0],'🖼️')}
 else if(c==='theme'){S.theme=S.theme==='light'?'dark':'light';applyTheme();save()}
 else if(c==='motion'){S.motion=!S.motion;applyTheme();save();toast('Animations',S.motion?'On':'Off','⚙️')}
 else if(c==='min'){[...wins.keys()].forEach(minWin)}
 else if(c==='newdir'){newItem(['Desktop'],'dir')}}
function openLauncher(){const lau=$('#lau');lau.hidden=false;$('#lq').value='';renderLauncher('');$('#lq').focus()}
function closeLauncher(){$('#lau').hidden=true}
function renderLauncher(q){q=q.trim().toLowerCase();const items=[];
 Object.entries(APPS).forEach(([id,a])=>items.push({t:a.n,s:'Application',ic:a.ic,f:()=>openApp(id)}));
 GAMES.forEach(g=>items.push({t:g.t,s:'Game · '+g.c,ic:'🎮',f:()=>playGame(g.id)}));
 COMMANDS.forEach(([t,c])=>items.push({t,s:'Command',ic:'⌘',f:()=>cmd(c.split(':')[1])}));
 const hits=(q?items.filter(i=>(i.t+' '+i.s).toLowerCase().includes(q)):items).slice(0,12);
 $('#lr').innerHTML=hits.length?hits.map((i,n)=>`<button class="res${n===0?' sel':''}" data-i="${n}"><span class="ico" style="--c:#444">${i.ic}</span><span><b>${esc(i.t)}</b><small>${esc(i.s)}</small></span></button>`).join(''):'<p class="pad m">Nothing matches.</p>';
 window._hits=hits}
function pickLauncher(i){const h=window._hits&&window._hits[i];if(!h)return;closeLauncher();h.f()}
$('#lq').addEventListener('input',e=>renderLauncher(e.target.value));
$('#lr').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)pickLauncher(+b.dataset.i)});
$('#lau').addEventListener('click',e=>{if(e.target.id==='lau')closeLauncher()});
$('#start').onclick=()=>$('#lau').hidden?openLauncher():closeLauncher();
$('#lq').addEventListener('keydown',e=>{const sel=[...document.querySelectorAll('#lr .res')];if(!sel.length)return;let i=sel.findIndex(x=>x.classList.contains('sel'));
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel[i]?.classList.remove('sel');i=(i+(e.key==='ArrowDown'?1:-1)+sel.length)%sel.length;sel[i].classList.add('sel');sel[i].scrollIntoView({block:'nearest'})}
 else if(e.key==='Enter'){e.preventDefault();pickLauncher(+sel[Math.max(i,0)].dataset.i)}});

/* ---------- Keyboard ---------- */
addEventListener('keydown',e=>{
 if(e.ctrlKey&&e.code==='Space'){e.preventDefault();$('#lau').hidden?openLauncher():closeLauncher();return}
 if(e.key==='Escape'){if(!$('#lau').hidden)closeLauncher();else hideCtx();return}
 if(e.altKey&&e.key==='Tab'){e.preventDefault();const list=[...wins.values()];if(list.length>1){const cur=list.findIndex(r=>r.el.classList.contains('on'));focusWin(list[(cur+1)%list.length].key)}}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='w'&&document.activeElement.closest('.win')){e.preventDefault();const r=[...wins.values()].find(x=>x.el.contains(document.activeElement));if(r)closeWin(r.key)}});

/* ---------- Clock ---------- */
function tick(){const d=new Date();$('#clk b').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});$('#clk span').textContent=d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})}

/* ---------- Boot ---------- */
applyTheme();renderDesktop();updateTasks();tick();setInterval(tick,15000);
toast('MythosOS 0.2','Welcome back. Press Ctrl+Space to search.','🌅');
</script>
</body>
</html>
