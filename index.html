<title>MythosOS</title>
<style>

:root{--bg:#0a1316;--s:#12212a;--s2:#1b313c;--t:#e8eef0;--m:#93a8b1;--a:#e8a45a;--ai:#1a1206;--b:#ffffff24;--sh:0 14px 44px #0009;--d:.24s}

#hero{--h:28;position:relative;color:#fff;min-height:min(46vh,420px);display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between;padding:clamp(20px,4vw,44px);border-radius:28px;overflow:hidden;border:1px solid var(--b);transition:--h .7s;background:radial-gradient(70% 120% at 85% 20%,hsl(var(--h) 70% 45%/.55),transparent 70%),linear-gradient(135deg,hsl(var(--h) 45% 14%),hsl(var(--h) 40% 8%))}

.pb{background:var(--a);color:var(--ai)}.sb{background:var(--s2);border:1px solid var(--b)}.sb[aria-pressed=true] .i{fill:currentColor}

.art span{font:700 clamp(34px,5vw,54px) Georgia,serif;color:#fff;opacity:.9}

.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}

#desk{position:fixed;inset:0 0 80px;padding:18px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,98px);grid-auto-columns:96px;gap:6px;align-content:start;justify-content:start;z-index:5;transition:opacity var(--d)}

.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:var(--s);border:1px solid var(--b);border-radius:16px;box-shadow:0 8px 30px #0006;overflow:hidden;container-type:inline-size;animation:pop var(--d) backwards;min-width:300px;min-height:200px}
.win.on{box-shadow:var(--sh);border-color:color-mix(in srgb,var(--a) 55%,var(--b))}.win.min{display:none}
.win.out{opacity:0;transform:scale(.96);transition:var(--d)}

.wb{flex:1;min-height:0;overflow:auto}

const isDir=n=>typeof n==='object',split=s=>s?s.split('/'):[];

 if(n in d){notify('Files','“'+n+'” already exists here.','folder');return}d[n]=d[old];delete d[old];if(W['f:'+ps])closeWin('f:'+ps);fsChanged()}
async function fdel(ps){const p=split(ps),n=p.pop(),d=at(p);if(!d||!(n in d))return;if(await ask('Delete “'+n+'”?',{m:'This cannot be undone.',ok:'Delete'})){delete d[n];if(W['f:'+ps])closeWin('f:'+ps);fsChanged()}}
async function fprops(ps){const p=split(ps),n=at(p);if(n===null)return;await ask('Properties',{m:p[p.length-1]+': '+(isDir(n)?'Folder':'File')+', '+size(n)+', located at /'+p.join('/'),ok:'Close'})}

/* ===== Mythos AI (local responder; set AI.endpoint to connect a real backend) ===== */
const AIP=['What can MythosOS do?','Open Settings.','How do I change my wallpaper?','Show me my recent apps.'];
function aiLocal(t){const q=t.toLowerCase(),has=w=>new RegExp('\\b'+w).test(q),app=Object.entries(APPS).find(([id,a])=>has(id)||has(a.n.toLowerCase()));
 if(/^(hi|hello|hey)\b/.test(q))return{t:'Hello! Ask me what MythosOS can do, or tell me what to open.'};
 if(has('recent')){const r=S.rec.map(x=>x.k==='a'?APPS[x.id].n:G.find(g=>g.id===x.id).t);return{t:r.length?'Recently used: '+r.slice(0,6).join(', ')+'.':'Nothing yet. Open an app or play a game and it will show up here.'}}
 if(has('wallpaper')||has('background'))return{t:'Settings > Personalization > Wallpaper has seven options. You can also right-click the desktop and choose Change Wallpaper.',a:[['Open Personalization','sc:Personalization'],['Next wallpaper','wall:next']]};
 if(/dark mode|light mode|theme/.test(q)){if(/dark/.test(q)){S.theme='dark';apply();save();return{t:'Switched to Mythos Dark.'}}if(/light/.test(q)){S.theme='light';apply();save();return{t:'Switched to Mythos Light.'}}return{t:'There are six themes. Pick one in Personalization.',a:[['Open Personalization','sc:Personalization']]}}
 if(app&&/open|launch|start|show/.test(q))return{t:'Opening '+app[1].n+'.',run:'app:'+app[0]};
 if(has('favorite'))return{t:S.fav.length?'Your favorites: '+S.fav.map(id=>G.find(g=>g.id===id).t).join(', ')+'.':'No favorites yet. Tap the heart on any game in Arcade.',a:[['Open Arcade','acat:Favorites']]};
 if(has('time')||has('date'))return{t:'It is '+new Date().toLocaleString()+'.'};
 if(has('sentinel')||has('privacy')||has('secure'))return{t:'Sentinel reports on the MythosOS simulation, and everything stays in this browser.',a:[['Open Sentinel','app:sentinel']]};
 if(has('game')||has('play')){const g=G[Math.floor(Math.random()*G.length)];return{t:'Try '+g.t+': '+g.d,a:[['View '+g.t,'gdet:'+g.id]]}}
 if(/what can|help|do you|can you|mythosos/.test(q))return{t:'I can open apps, switch themes, list your recent apps and favorites, and point you to settings. Press Ctrl+Space for the launcher or Ctrl+Shift+P for commands.'};
 return{t:'I am a small local assistant, so I may miss that one. Try "open files", "recent apps" or "change wallpaper".'}}
const AI={endpoint:null,async ask(t){if(this.endpoint){try{const r=await fetch(this.endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt:t})}),j=await r.json();if(j&&typeof j.reply==='string')return{t:j.reply}}catch(e){}}await new Promise(r=>setTimeout(r,450));return aiLocal(t)}};
function aiRender(b){b.innerHTML=`<div class="ch"><div class="msgs" id="msgs" role="log" aria-live="polite"></div><div class="sug">${AIP.map(p=>`<button class="pill" data-act="ask:${esc(p)}">${esc(p)}</button>`).join('')}<button class="pill" data-act="aiclr">New chat</button></div><form class="cin"><input data-af aria-label="Message Mythos AI" placeholder="Ask Mythos AI" autocomplete="off"><button class="pb">Send</button></form><small class="nt2">Local assistant running in your browser. No cloud model is connected.</small></div>`;aiFill()}
function aiFill(typing){const m=$('#msgs');if(!m)return;m.innerHTML=(S.chat.length?S.chat:[{r:'a',t:'Hi, I am Mythos AI, a local assistant built into this prototype. Ask me about MythosOS or tell me what to open.'}]).map(x=>`<div class="mg ${x.r}">${esc(x.t)}${x.a&&x.a.length?`<div class="qa">${x.a.map(([l,a])=>`<button class="pill" data-act="${esc(a)}">${esc(l)}</button>`).join('')}</div>`:''}</div>`).join('')+(typing?'<div class="mg a" aria-label="Mythos AI is typing">…</div>':'');m.scrollTop=m.scrollHeight}
async function aiSend(text){text=text.trim();if(!text)return;S.chat.push({r:'u',t:text});aiFill(true);const r=await AI.ask(text);S.chat.push({r:'a',t:r.t,a:r.a});S.chat=S.chat.slice(-40);save();aiFill();if(r.run)act(r.run)}

/* ===== Sentinel ===== */
const browser=()=>{const b=navigator.userAgentData&&navigator.userAgentData.brands.find(x=>!/not.?a.?brand|chromium/i.test(x.brand));return b?b.brand+' '+b.version:'unknown browser'};
function checks(){let st=true,c=0;try{localStorage.setItem('mythos.t','1');localStorage.removeItem('mythos.t')}catch(e){st=false}walk(FS,[],()=>c++);
 return[['Virtual filesystem',true,c+' items stored locally'],['Local storage',st,st?'Preferences persist in this browser':'Unavailable: changes will not persist'],['Applications',true,order.length+' window(s) open'],['Notifications',true,N.filter(n=>!n.read).length+' unread'],['Browser environment',true,browser()+(navigator.onLine?', online':', offline'),'Detected']]}
function sentinelRender(b){const c=checks(),good=c.every(x=>x[1]);
 b.innerHTML=`<div class="main"><h1 style="font-size:2em">Sentinel</h1><p>${good?'MythosOS is operating normally.':'Some checks need attention.'}</p>${c.map(([n,o,d,l])=>row(n,esc(d),`<b class="${o?'g':'w'}">${ic(o?'check':'warn')} ${o?l||'Healthy':'Attention'}</b>`)).join('')}<h3>Privacy and permissions</h3><p>MythosOS asks for no browser permissions. Fullscreen only happens when you request it, and nothing leaves this browser.</p><div class="hb"><button class="pb" data-act="sen">Run check</button></div><p class="nt2" style="margin-top:14px">Sentinel watches the MythosOS simulation. It is not antivirus software and does not scan your device.</p></div>`}

/* ===== Settings ===== */
const row=(t,s,c='')=>`<div class="rw"><div>${t}<small>${s}</small></div><div>${c}</div></div>`;
const swt=(a,l,on)=>`<span class="nt2">${on?'On':'Off'}</span> <button class="sx" role="switch" aria-checked="${on}" aria-label="${l}" data-act="${a}"></button>`;
const opts=(k,l,cur)=>`<div class="sg">${l.map(([v,n,bg])=>`<button class="op" aria-pressed="${String(cur)===String(v)}" data-act="set:${k}:${v}">${bg?`<span class="sw" style="background:${bg}"></span>`:''}${n}</button>`).join('')}</div>`;
const kb=()=>(new Blob([ls.get(KEY)||'']).size/1024).toFixed(1)+' KB';
const ANIM=[[2,'Full'],[1,'Reduced'],[0,'Off']];
const SP={
System:()=>`<h3>System</h3>${row('Version','Prototype build','MythosOS 0.1')}${row('Session','Started '+new Date(T0).toLocaleTimeString(),Math.max(1,Math.round((Date.now()-T0)/6e4))+' min')}${row('Browser',esc(navigator.userAgent.slice(0,80)),esc(navigator.language))}${row('Storage used','Preferences and virtual files, saved in this browser',kb())}`,
Personalization:()=>`<h3>Theme</h3>${opts('theme',Object.entries(THEMES).map(([k,n])=>[k,n,`linear-gradient(135deg,${THC[k][0]} 60%,${THC[k][1]} 60%)`]),S.theme)}<h3>Wallpaper</h3>${opts('wall',Object.entries(WALLS).map(([k,[n,b]])=>[k,n,b]),S.wall)}<h3>Accent</h3>${opts('accent',[['','Theme default'],...ACC.map(c=>[c,c,c])],S.accent)}<h3>Animation intensity</h3>${opts('anim',ANIM,S.anim)}<h3>Interface mode</h3><div class="sg">${['home','desktop'].map(m=>`<button class="op" aria-pressed="${S.mode===m}" data-act="mode:${m}">${m==='home'?'Home':'Desktop'}</button>`).join('')}</div><h3>Profile</h3>${row('Display name','Local profile, never uploaded',`<input id="pname" value="${esc(S.name)}" maxlength="24" aria-label="Display name">`)}`,
Applications:()=>'<h3>Applications</h3>'+Object.entries(APPS).map(([id,a])=>row(esc(a.n)+' in taskbar',esc(a.d),swt('pin:'+id,'Pin '+a.n,S.pins.includes(id)))).join(''),
Gaming:()=>`<h3>Gaming</h3>${row('Favorites',S.fav.length+' games','<button class="sb" data-act="favclr">Clear</button>')}${row('Recently played',S.rec.filter(r=>r.k==='g').length+' games','<button class="sb" data-act="recclr">Clear</button>')}`,
Notifications:()=>`<h3>Notifications</h3>${row('Do Not Disturb','Mute pop-ups. Notifications still collect in the center.',swt('tg:dnd','Do Not Disturb',S.dnd))}${row('Notification center',N.length+' this session','<button class="sb" data-act="nclr">Clear all</button>')}`,
Privacy:()=>`<h3>Privacy</h3>${row('Where data lives','Everything stays in this browser. MythosOS makes no network requests.','')}${row('Reset MythosOS','Clears preferences, favorites and virtual files','<button class="sb" data-act="reset">Reset…</button>')}`,
Accessibility:()=>`<h3>Motion</h3>${opts('anim',ANIM,S.anim)}<p class="nt2">Your system's reduced-motion setting is always respected.</p><h3>Performance</h3>${row('Lite mode','Removes blur and shadows',swt('tg:perf','Lite mode',S.perf))}`,
Keyboard:()=>'<h3>Keyboard</h3>'+[['Launcher','Ctrl+Space'],['Command palette','Ctrl+Shift+P'],['Settings','Ctrl+,'],['Switch windows','Alt+Tab or Alt+`'],['Close overlay','Esc'],['Move between cards','Arrow keys']].map(([a,b])=>row(a,'',`<kbd>${b}</kbd>`)).join(''),
About:()=>'<h3>About MythosOS</h3><p>Your world. Your system.</p><p class="nt2">Prototype 0.1. A single-file web desktop with no frameworks and no network.</p>'};
function settingsRender(b){b.innerHTML=`<div class="se"><nav class="side" aria-label="Settings categories">${SCATS.map(c=>`<button class="si${c===ST.cat?' on':''}" data-act="sc:${c}"${c===ST.cat?' aria-current="true"':''}>${c}</button>`).join('')}</nav><div class="main">${SP[ST.cat]()}</div></div>`}
const settingsAll=()=>{const w=W.settings;if(w)settingsRender($('.wb',w.el))},sentinelAll=()=>{const w=W.sentinel;if(w)sentinelRender($('.wb',w.el))};
const RENDER={arcade:arcadeRender,files:filesRender,ai:aiRender,sentinel:sentinelRender,settings:settingsRender};

/* ===== Context menu ===== */
const cm=$('#cm'),hideMenu=()=>cm.classList.remove('show');
function menu(x,y,items){cm.innerHTML=items.map(i=>i?`<button role="menuitem" data-act="${esc(i[1])}">${esc(i[0])}</button>`:'<hr>').join('');cm.className='show';const r=cm.getBoundingClientRect();cm.style.left=clamp(x,4,innerWidth-r.width-4)+'px';cm.style.top=clamp(y,4,innerHeight-r.height-4)+'px';$('button',cm).focus()}
addEventListener('contextmenu',e=>{const t=e.target;if(t.closest('input,textarea,select,dialog,#cm'))return;let it=null;const f=t.closest('[data-p]'),g=t.closest('[data-g]');
 if(f){const p=f.dataset.p;it=[['Open','fopen:'+p],['Rename','frename:'+p],['Delete','fdel:'+p],null,['Properties','fprops:'+p]]}
 else if(g){const id=g.dataset.g;it=[['Play','game:'+id],[S.fav.includes(id)?'Remove favorite':'Favorite','fav:'+id],['Details','gdet:'+id]]}
 else if(t.closest('.fbody'))it=[['New folder','fnew:dir'],['New text file','fnew:file'],['Refresh','fref']];
 else if(!t.closest('.win,#top,#dock,.ov')&&t.closest('#desk,#wall,#home'))it=[['New Folder','dnew'],['Change Wallpaper','wall:next'],['Refresh','dref'],null,['Open Settings','app:settings'],['Open Arcade','app:arcade'],null,['Display Mode: '+(S.mode==='home'?'Desktop':'Home'),'mode:'+(S.mode==='home'?'desktop':'home')]];
 if(it){e.preventDefault();menu(e.clientX,e.clientY,it)}});

/* ===== Actions (single delegated dispatcher) ===== */
function act(a){const i=a.indexOf(':'),k=i<0?a:a.slice(0,i),v=i<0?'':a.slice(i+1);switch(k){
case'app':openApp(v);break;
case'game':playGame(v);break;
case'gdet':arc.g=v;arc.q='';openApp('arcade');arcadeAll();break;
case'acat':arc.cat=v;arc.g=null;openApp('arcade');arcadeAll();break;
case'aback':arc.g=null;arcadeAll();break;
case'fav':keepFocus(()=>toggleFav(v));break;
case'mode':setMode(v);keepFocus(settingsAll);break;
case'view':view=v;if(S.mode==='home')order.forEach(x=>W[x].el.classList.add('min'));renderHome();sync();break;
case'feat':feat=+v;keepFocus(heroFill);break;
case'ov':ovOpen(v);break;
case'dock':dockClick(v);break;
case'cc':ccAct(v);break;
case'theme':S.theme=S.theme==='light'?'dark':'light';apply();save();keepFocus(settingsAll);break;
case'wall':{const ks=Object.keys(WALLS);S.wall=ks[(ks.indexOf(S.wall)+1)%ks.length];apply();save();toast('Wallpaper',WALLS[S.wall][0],'apps');keepFocus(settingsAll)}break;
case'fs':toggleFS();break;
case'swstart':ovClose();swStep(1);break;
case'swp':if(sw){sw.i=+v;swEnd(true)}break;
case'sc':ST.cat=v;openApp('settings');settingsAll();break;
case'set':{const j=v.indexOf(':'),key=v.slice(0,j),val=v.slice(j+1);S[key]=key==='anim'?+val:val;apply();save();keepFocus(settingsAll)}break;
case'tg':S[v]=!S[v];apply();save();keepFocus(settingsAll);break;
case'pin':{const j=S.pins.indexOf(v);if(j<0)S.pins.push(v);else S.pins.splice(j,1);save();dockFill();keepFocus(settingsAll)}break;
case'ask':aiSend(v);break;
case'aiclr':S.chat=[];save();aiFill();break;
case'nclr':N.length=0;badge();if(OV==='nc')ncFill();keepFocus(settingsAll);break;
case'ndel':{const j=N.findIndex(x=>x.id===+v);if(j>=0)N.splice(j,1);badge();ncFill()}break;
case'sen':{sentinelAll();const bad2=checks().some(c=>!c[1]);notify('Sentinel',bad2?'Check complete: something needs attention.':'Check complete: all MythosOS systems are healthy.','shield')}break;
case'favclr':S.fav=[];save();renderHome();arcadeAll();keepFocus(settingsAll);break;
case'recclr':S.rec=S.rec.filter(r=>r.k!=='g');S.played={};save();renderHome();arcadeAll();keepFocus(settingsAll);break;
case'reset':ask('Reset MythosOS?',{m:'This clears preferences, favorites and the virtual file system stored in this browser, then reloads.',ok:'Reset'}).then(ok=>{if(ok){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}});break;
case'fopen':fopen(v);break;
case'fup':F.p=F.p.slice(0,-1);F.q='';filesAll();break;
case'fgo':F.p=split(v);F.q='';filesAll();break;
case'fview':F.v=F.v==='grid'?'list':'grid';filesAll();break;
case'fnew':fnew(v);break;case'frename':frename(v);break;case'fdel':fdel(v);break;case'fprops':fprops(v);break;
case'fref':filesAll();break;
case'dnew':fnew('dir',['Desktop']);break;
case'dref':deskFill();toast('Desktop','Refreshed','apps');break;
case'signout':lock();break;
case'unlock':os.inert=false;$('#boot').classList.add('off');break}}

document.addEventListener('click',e=>{const t=e.target;
 if(!t.closest('#cm'))hideMenu();
 if(t.classList.contains('ov')){t.id==='swt'?swEnd(false):ovClose();return}
 const w=t.closest('[data-w]');if(w){wact(w.closest('.win').dataset.k,w.dataset.w);return}
 const d=t.closest('[data-dact]');
 if(d){$$('.pick').forEach(x=>x.classList.remove('pick'));d.classList.add('pick');if(e.detail===0||coarse)act(d.dataset.dact);return}
 if(!t.closest('.di,.fi'))$$('.pick').forEach(x=>x.classList.remove('pick'));
 const a=t.closest('[data-act]');if(!a)return;
 if(a.classList.contains('res'))ovClose();if(a.closest('#cm'))hideMenu();act(a.dataset.act)});
document.addEventListener('dblclick',e=>{const d=e.target.closest('[data-dact]');if(d){act(d.dataset.dact);return}const t=e.target.closest('.wt');if(t&&!e.target.closest('button'))wact(t.closest('.win').dataset.k,'max')});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='lq')lauList(t.value);else if(t.id==='pq')palList(t.value);else if(t.id==='asq'){arc.q=t.value;arcFill()}else if(t.id==='fq'){F.q=t.value;ffill()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='pname'){S.name=t.value.trim().slice(0,24)||D.name;save();$('#av').textContent=S.name[0].toUpperCase()}else if(t.id==='fsort'){F.s=t.value;filesAll()}});
document.addEventListener('submit',e=>{if(e.target.matches('.cin')){e.preventDefault();const i=$('input',e.target);aiSend(i.value);i.value=''}});
addEventListener('keydown',e=>{if($('#dlg').open)return;const k=e.key,mod=e.ctrlKey||e.metaKey;
 if(e.ctrlKey&&e.code==='Space'){e.preventDefault();ovOpen('lau');return}
 if(mod&&e.shiftKey&&k.toLowerCase()==='p'){e.preventDefault();ovOpen('pal');return}
 if(mod&&k===','){e.preventDefault();openApp('settings');return}
 if(e.altKey&&(k==='Tab'||k==='`')){e.preventDefault();swStep(e.shiftKey?-1:1);return}
 const m=cm.classList.contains('show');
 if(k==='Escape'){if(m)hideMenu();else if(sw)swEnd(false);else ovClose();return}
 if(m&&(k==='ArrowDown'||k==='ArrowUp')){e.preventDefault();const b=$$('#cm button'),i=b.indexOf(document.activeElement);b[(i+(k==='ArrowDown'?1:-1)+b.length)%b.length].focus();return}
 if(OV==='lau'||OV==='pal'){if(k==='ArrowDown'||k==='ArrowUp'){e.preventDefault();selMove(k==='ArrowDown'?1:-1)}else if(k==='Enter'){const s=$('#'+OV+' .res.sel')||$('#'+OV+' .res');if(s){e.preventDefault();s.click()}}return}
 if(k.startsWith('Arrow')&&e.target.closest&&e.target.closest('#home'))hnav(e)});
addEventListener('keyup',e=>{if(e.key==='Alt'&&sw)swEnd(true)});

/* ===== Clock ===== */
let lastDay='';function tick(){const d=new Date(),c=$('#clk');$('b',c).textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});const s=d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});if(s!==lastDay){lastDay=s;$('small',c).textContent=s}}

/* ===== Boot ===== */
apply();$('#av').textContent=S.name[0].toUpperCase();os.dataset.mode=S.mode;if(S.mode==='desktop')$('#dock').append($('#tray'));
renderHome();deskFill();sync();tick();setInterval(tick,1000);
[['Mythos Arcade','Welcome to MythosOS.','arcade',3],['Sentinel','System simulation is running normally.','shield',2],['Mythos AI','Ready when you are.','ai',1]].forEach(([a,m,i,n])=>notify(a,m,i,true,Date.now()-n*6e4));
if(bad)notify('MythosOS','Some MythosOS preferences could not be restored. Default settings have been loaded.','warn');
else setTimeout(()=>{if(!S.dnd)toast('Mythos Arcade','Welcome to MythosOS.','arcade')},1300);
setTimeout(()=>$('#boot').classList.add('off'),S.anim?900:0);
</script>
